name: Review regression
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pytest -q
      - run: python scripts/build_preview.py --check
      - run: python scripts/benchmark_agent.py --output .data/agent-regression.json
      - run: python scripts/benchmark_payment_terms.py --output .data/payment-before-after.json
      - name: Download and verify the actual published clause Adapter without a GPU
        run: |
          python scripts/download_adapter.py --output .data/adapter-check
          python scripts/download_adapter.py --output .data/adapter-check --verify-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-engineering-regression
          path: |
            .data/agent-regression.json
            .data/payment-before-after.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
  portable-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build and start the CPU demo exactly as documented
        run: python scripts/demo.py start
      - name: Exercise the real web proxy and approval workflow
        run: |
          set -a
          . ./.env
          set +a
          python scripts/smoke_demo.py
      - name: Logs on failure
        if: failure()
        run: python scripts/demo.py logs
      - name: Stop this demo
        if: always()
        run: python scripts/demo.py stop
