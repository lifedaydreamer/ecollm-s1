services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tradepilot
      POSTGRES_USER: tradepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tradepilot"]
      interval: 10s
      retries: 5
  redis:
    image: redis:7-alpine
    profiles: [queue]
    command: [redis-server, --appendonly, 'yes']
    volumes: ["redis:/data"]
  api:
    build: .
    environment:
      TRADEPILOT_TOKEN: ${TRADEPILOT_TOKEN:?set TRADEPILOT_TOKEN}
      DATABASE_URL: postgresql+psycopg://tradepilot:${POSTGRES_PASSWORD}@db/tradepilot
    volumes: ["documents:/app/.data"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./web
    environment:
      TRADEPILOT_TOKEN: ${TRADEPILOT_TOKEN}
      TRADEPILOT_API_URL: http://api:8100
    ports: ["127.0.0.1:3100:3100"]
    depends_on: [api]
volumes:
  postgres:
  redis:
  documents:
